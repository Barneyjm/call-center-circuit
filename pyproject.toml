[project]
name = "call-center-circuit"
version = "0.1.0"
description = "A support-line triage agent built on decision circuits: typed questions, calibrated answers, decisions in code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["decision-circuits>=0.5.4"]

[project.optional-dependencies]
openai = ["decision-circuits[openai]"]
anthropic = ["decision-circuits[anthropic]"]

[project.scripts]
callcenter = "callcenter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callcenter"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
